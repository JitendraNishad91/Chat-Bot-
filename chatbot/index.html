<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
     <div class="chat_container">
      
    
        <div class="ai_chat_box">
            <img src="ai image new.png" alt="" id="aiImage" width="5%">
            <div class="ai_chat_area">
             hello i am AI chatbot how can i help you
            </div>
          
        </div>
     </div>
    
  <div class="prompt_area">
  <input type="text" id="prompt" placeholder="Type your message here...">

  <!-- File Upload Button -->
  <label for="fileInput" id="image">
    <img src="img.svg" alt="Upload">
  </label>
  <input type="file" accept="images/*" id="fileInput" hidden>

  <button id="submit">
    <img src="submit.svg" alt="send">
  </button>
</div>
     

     <script src="script.js">

     </script>
</body>
</html>
